# Dispatch exactly ONE E2E cell with chosen parameters — the narrow-iteration
# workflow the ci-fix-loop practice uses: debug a single failing scenario
# without burning the whole matrix per attempt. The full PR-gating matrix
# lives in e2e-tests.yml; keep the step sequence here in sync with it.
name: E2E single cell

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      base:
        description: Base image the VM installs first
        required: false
        default: ghcr.io/projectbluefin/bluefin:stable
      target:
        description: Target image the migration/re-base moves to
        required: false
        default: ghcr.io/projectbluefin/dakota:stable
      filesystem:
        description: Root filesystem layout
        required: false
        default: btrfs
        type: choice
        options: [btrfs, ext4, xfs, xfs+crypt, xfs+lvm+crypt]
      disk_size:
        description: Guest disk size (ENOSPC shows up as misleading downstream errors)
        required: false
        default: 40G
      mode:
        description: Harness mode (E2E_MODE)
        required: false
        default: composefs-migrate
        type: choice
        options: [composefs-migrate, ostree-rebase-plan, ostree-rebase, tui-migrate]
      cross_base:
        description: >-
          Pass --accept-cross-base and assert the cross-base remap report is
          emitted (ostree-rebase mode only). Fails the run if the image pair
          turns out NOT to be cross-base, so the check can't pass vacuously.
        required: false
        default: false
        type: boolean
      runner:
        description: >-
          Runner override for THIS dispatch only (e.g. ubuntu-24.04, or a
          self-hosted label). Leave empty for the same selection
          e2e-tests.yml uses: E2E_RUNSON_SPEC, else E2E_SELF_HOSTED=true,
          else ubuntu-latest.
        required: false
        default: ""

# Dispatch-only debug workflow — same QEMU/KVM requirement and runner
# selection as e2e-tests.yml (see its job comment and docs/testing.md
# "KVM runner options"): RunsOn when E2E_RUNSON_SPEC is set, the
# "kvm"-labelled self-hosted host when E2E_SELF_HOSTED=true, otherwise
# ubuntu-latest. An explicit `runner` input overrides all three, and
# KVM_E2E_ENABLED='false' kills both workflows.
jobs:
  e2e:
    if: ${{ vars.KVM_E2E_ENABLED != 'false' || inputs.runner != '' }}
    name: "${{ inputs.base }} -> ${{ inputs.target }} (${{ inputs.filesystem }}, ${{ inputs.mode }})"
    runs-on: >-
      ${{ inputs.runner != '' && inputs.runner ||
          (vars.E2E_RUNSON_SPEC != '' &&
          format('runs-on={0}/{1}', github.run_id, vars.E2E_RUNSON_SPEC) ||
          (vars.E2E_SELF_HOSTED == 'true' &&
           fromJSON('["self-hosted", "kvm"]') || 'ubuntu-latest')) }}
    # Matches e2e-tests.yml: the tui-migrate cell measured 65 min end to
    # end on a hosted runner, and a debug dispatch should never die of a
    # tighter budget than the gating matrix it mirrors.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9

      # GitHub-hosted runner images ship a podman storage config whose
      # overlay options leave "Native Overlay Diff: false", so every
      # layer commit falls back to the naive diff driver — a full
      # walk-and-compare of the ~10 GB bluefin rootfs, measured at
      # ~30 min per trivial RUN on the 2026-08-27 probes (disk itself
      # was fine: 419 MB/s; driver was already overlay, not vfs).
      # Replace it with a minimal storage.conf (no mount_program, no
      # ignore_chown_errors) and reset the (still empty at this point)
      # graph so rootful podman uses native kernel overlayfs diffs.
      # Skipped on the self-hosted host, which keeps its own config and a
      # graph of cached images worth keeping.
      - name: Use native overlay diffs for podman
        if: ${{ inputs.runner != '' || vars.E2E_SELF_HOSTED != 'true' }}
        run: |
          sudo tee /etc/containers/storage.conf >/dev/null <<'EOF'
          [storage]
          driver = "overlay"
          runroot = "/run/containers/storage"
          graphroot = "/var/lib/containers/storage"
          EOF
          sudo rm -rf /var/lib/containers/storage
          sudo podman info | grep -iA5 'graphStatus' || true

      # Only on probe dispatches (runner override set): surface the I/O
      # facts that decide whether a hosted runner is viable — podman's
      # storage driver ("Native Overlay Diff: false" means naive
      # walk-the-whole-image layer commits) and raw disk write
      # throughput (Azure burst credit exhaustion shows up here).
      - name: Runner I/O diagnostics (probe only)
        if: ${{ inputs.runner != '' }}
        run: |
          echo "=== podman storage driver ==="
          sudo podman info --format '{{.Store.GraphDriverName}} rootless={{.Host.Security.Rootless}}' || true
          sudo podman info | grep -iA5 'graphDriverName\|graphRoot\|graphStatus' || true
          echo "=== filesystems ==="
          df -hT / /var/lib/containers 2>/dev/null || df -hT /
          echo "=== raw write throughput (1 GiB) ==="
          sudo mkdir -p /var/lib/containers
          sudo dd if=/dev/zero of=/var/lib/containers/ddtest bs=1M count=1024 conv=fdatasync 2>&1 | tail -1
          sudo rm -f /var/lib/containers/ddtest

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86 qemu-utils ovmf podman jq iproute2 \
            netcat-openbsd cryptsetup lvm2 xfsprogs dosfstools swtpm swtpm-tools

      - name: Enable KVM access
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            echo "KVM acceleration available:"
            ls -la /dev/kvm
          else
            echo "::warning::/dev/kvm not present; TCG fallback will be slow"
          fi

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build migration binary
        run: cargo build --release && cargo test --release

      - name: Pull base + target images
        run: |
          set -eux
          sudo podman pull "${{ inputs.base }}"
          sudo podman pull "${{ inputs.target }}"

      - name: Run E2E cell
        run: |
          set -o pipefail
          sudo -E PATH="$PATH" \
            BASE_IMAGE="${{ inputs.base }}" \
            TARGET_IMAGE="${{ inputs.target }}" \
            FILESYSTEM="${{ inputs.filesystem }}" \
            DISK_SIZE="${{ inputs.disk_size }}" \
            E2E_MODE="${{ inputs.mode }}" \
            E2E_CROSS_BASE="${{ inputs.cross_base && '1' || '0' }}" \
            ./tests/run-e2e.sh 2>&1 | tee e2e-run.log

      # tui-migrate runs record both interactive flows as asciicast v2
      # (tests/tui-e2e-driver.py --record) and save a plain-text
      # screenshot per wizard screen. Render the casts to timelapse GIFs
      # with agg (pinned by sha256) and publish everything as artifacts —
      # the automated successor to scripts/capture-screenshots.sh.
      - name: Render TUI timelapse GIFs
        if: ${{ always() && inputs.mode == 'tui-migrate' }}
        run: |
          if [ ! -f tui-migrate.cast ] && [ ! -f tui-drift.cast ]; then
            echo "no asciicast produced (run failed before the TUI flows)"; exit 0
          fi
          curl -sSL -o /tmp/agg \
            https://github.com/asciinema/agg/releases/download/v1.5.0/agg-x86_64-unknown-linux-gnu
          echo "59673469d625df6f55c72159c84ffbb7af1348ac379d0e79db43f4b80fb986a3  /tmp/agg" | sha256sum -c -
          chmod +x /tmp/agg
          # idle-time-limit collapses the long quiet phases (image pulls,
          # sealing) so a ~20-min migration plays back in a couple of
          # minutes — the timelapse effect.
          if [ -f tui-migrate.cast ]; then
            /tmp/agg --idle-time-limit 2 --speed 3 tui-migrate.cast tui-migrate.gif || true
          fi
          if [ -f tui-drift.cast ]; then
            /tmp/agg --idle-time-limit 2 tui-drift.cast tui-drift.gif || true
          fi
          ls -la tui-*.gif 2>/dev/null || true

      - name: Upload TUI walkthrough artifacts
        if: ${{ always() && inputs.mode == 'tui-migrate' }}
        uses: actions/upload-artifact@v4
        with:
          name: tui-walkthrough
          path: |
            tui-migrate.cast
            tui-drift.cast
            tui-migrate.gif
            tui-drift.gif
            tui-snapshots/
          if-no-files-found: warn
          retention-days: 14

      - name: Failure triage into job summary
        if: failure()
        run: |
          {
            echo "## E2E failure triage — single cell"
            if [ -f e2e-run.log ]; then
              echo '### Last phase reached'
              echo '```'
              grep -aE '^=== |\[e2e [0-9:]+\] ===' e2e-run.log | tail -5
              echo '```'
              echo '### Assertions and errors'
              echo '```'
              grep -aE 'FAIL:|ERROR:|Migration Failed|panicked' e2e-run.log | tail -20
              echo '```'
              echo '### Log tail'
              echo '```'
              tail -40 e2e-run.log
              echo '```'
            else
              echo 'e2e-run.log was never created — failure predates the harness.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-single-logs
          path: |
            e2e-run.log
            qemu.log
            ovmf_vars.fd
          if-no-files-found: warn
          retention-days: 7
