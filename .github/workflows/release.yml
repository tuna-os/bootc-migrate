# Releasing is automatic: the workspace version in Cargo.toml is the release
# decision, and merging it to main is what cuts the release.
#
#   1. A change bumps `version` under [workspace.package].
#   2. It merges to main.
#   3. This workflow sees no tag for that version, builds, and creates the
#      GitHub Release (which creates the tag) plus the container image.
#
# A push to main whose version already has a tag does nothing but the cheap
# `resolve` job, so ordinary merges cost seconds.
#
# Pushing a v* tag by hand still works and is the escape hatch for releasing
# outside this flow.
#
# WHY THE TAG IS NOT PUSHED SEPARATELY
#
# Two constraints shape this file, and both are easy to reintroduce:
#
#   - A tag pushed with GITHUB_TOKEN does NOT start a workflow run. So a
#     "tag on main, let the tag trigger the release" design silently produces
#     tags with no binaries and no image — which is exactly how v0.5.0 ended
#     up documented in the README but never released (issue #240). Everything
#     therefore happens inside the run that made the decision.
#   - This account enforces immutable releases: assets must be present when
#     the release is created, and cannot be uploaded afterwards. So the single
#     `gh release create` below carries every artifact at once, and it runs
#     only after the builds have succeeded — `gh release create` creates the
#     tag itself, so a failed build leaves no tag behind to clean up.
name: Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

# Serialised, never cancelled: two merges landing together must not both
# decide to release the same version, and a half-finished release is worse
# than a slow one.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository_owner }}/bootc-migrate

jobs:
  resolve:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.r.outputs.tag }}
      build: ${{ steps.r.outputs.build }}
      publish: ${{ steps.r.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are needed to answer "has this version been released?".
          fetch-depth: 0
      - id: r
        run: |
          set -euo pipefail

          # A hand-pushed tag releases exactly what it names.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            printf 'tag=%s\nbuild=true\npublish=true\n' "${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "::notice::tag push — releasing ${GITHUB_REF_NAME}"
            exit 0
          fi

          # Manual dispatch builds without releasing, so the Containerfile and
          # both cross-arch builds stay validated between releases.
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            printf 'tag=\nbuild=true\npublish=false\n' >> "$GITHUB_OUTPUT"
            echo "::notice::dispatch — building without releasing"
            exit 0
          fi

          # Push to main: read the one version every crate inherits.
          version="$(awk -F'"' '
            /^\[workspace\.package\]/ { s = 1; next }
            /^\[/                     { s = 0 }
            s && /^version[[:space:]]*=/ { print $2; exit }
          ' Cargo.toml)"

          if [[ -z "$version" ]]; then
            echo "::error file=Cargo.toml::could not read version from [workspace.package]"
            exit 1
          fi

          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            printf 'tag=%s\nbuild=false\npublish=false\n' "$tag" >> "$GITHUB_OUTPUT"
            echo "::notice::${tag} is already released — nothing to do"
            exit 0
          fi

          printf 'tag=%s\nbuild=true\npublish=true\n' "$tag" >> "$GITHUB_OUTPUT"
          echo "::notice::version ${version} has no ${tag} tag — releasing it"

  build:
    name: Build (${{ matrix.target }})
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          # build.rs reads the git SHA; a full checkout keeps that meaningful.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build + package
        run: |
          set -euo pipefail
          cargo build --release --target ${{ matrix.target }}
          name="bootc-migrate-${{ matrix.target }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/bootc-migrate" "$name-bin"
          tar -C target/${{ matrix.target }}/release -czf "dist/$name.tar.gz" bootc-migrate
          sha256sum "dist/$name.tar.gz" | awk '{print $1}' > "dist/$name.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/

  release:
    name: Publish release
    needs: [resolve, build]
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/
      - name: Create release with all assets (atomic — immutable-safe)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          ls -la dist/
          # --target pins the tag gh creates to the commit that was built.
          # It is ignored when the tag already exists (the hand-pushed path).
          gh release create "$TAG" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "$TAG" \
            --target "${GITHUB_SHA}" \
            --generate-notes

  container:
    name: Publish container image
    needs: [resolve, build]
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/
      - name: Stage per-arch binaries for the multi-platform build context
        run: |
          set -euo pipefail
          mkdir -p ctx/linux/amd64 ctx/linux/arm64
          tar -xzf dist/bootc-migrate-x86_64-unknown-linux-gnu.tar.gz -C ctx/linux/amd64
          tar -xzf dist/bootc-migrate-aarch64-unknown-linux-gnu.tar.gz -C ctx/linux/arm64
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr
        if: needs.resolve.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ctx
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.resolve.outputs.publish == 'true' }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.resolve.outputs.tag || 'dev' }}
            ${{ env.IMAGE }}:latest
