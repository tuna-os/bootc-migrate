name: E2E Migration Tests

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Cancel superseded runs on the same ref so PR pushes don't queue up redundant jobs.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# The scenarios boot full VMs via QEMU and need hardware KVM acceleration.
# GitHub-hosted Linux runners DO expose /dev/kvm (proven 2026-08-27 by the
# e2e-single probes: crw-rw-rw- root:kvm, guest SSH in 31s), so the matrix
# now defaults to ubuntu-latest and gates every PR. Fork pull requests stay
# excluded: these jobs run privileged containers and QEMU on the runner.
#
# Runner selection, highest precedence first (docs/testing.md "KVM runner
# options"):
# - E2E_RUNSON_SPEC set → RunsOn on AWS (https://runs-on.com) ephemeral EC2.
#   Value is the label spec after the routing key, e.g.
#   family=c8i+m8i+r8i/cpu=8/ram=32/volume=120gb/nested-virt/image=ubuntu24-full-x64/spot=false
#   (nested-virt needs an x64 image on a supported family; spot=false or
#   retry=when-interrupted because these jobs run 30-90 min). The expression
#   below prepends the per-run routing key RunsOn requires.
# - E2E_SELF_HOSTED=true → the "kvm"-labelled self-hosted host (kanpur).
# - neither → ubuntu-latest (the default).
#
# KVM_E2E_ENABLED is now a kill switch, not an enable switch: set it to
# 'false' to skip the whole matrix (e2e-gate treats a skipped run as a
# trivial pass). Unset or 'true' both run.
jobs:
  e2e:
    if: >-
      vars.KVM_E2E_ENABLED != 'false' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    name: ${{ matrix.scenario.name }}
    runs-on: >-
      ${{ vars.E2E_RUNSON_SPEC != '' &&
          format('runs-on={0}/{1}', github.run_id, vars.E2E_RUNSON_SPEC) ||
          (vars.E2E_SELF_HOSTED == 'true' &&
           fromJSON('["self-hosted", "kvm"]') || 'ubuntu-latest') }}
    # 90, not 45: the tui-migrate cell measured 65 min end to end on a
    # hosted runner (image bake + migration + reboot + rollback + commit,
    # all driven through the wizard). ci.yml's e2e-gate waits longer still.
    timeout-minutes: 90
    # Exploratory cells (aurora: see below) opt into continue-on-error via
    # matrix.scenario.allow_failure so they surface signal without dragging
    # down the "E2E Migration Tests" workflow conclusion e2e-gate polls —
    # ci.yml's e2e-gate reads the whole run's conclusion, not per-job.
    continue-on-error: ${{ matrix.scenario.allow_failure || false }}
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - name: bluefin -> dakota (systemd-boot + composefs)
            base: ghcr.io/projectbluefin/bluefin:stable
            target: ghcr.io/projectbluefin/dakota:stable
            # 20G intermittently ENOSPCs during the Phase-2 podman pull
            # (#42-class; last seen 2026-07-19) — match the other cells.
            disk_size: 40G
          - name: bluefin LTS -> dakota (systemd-boot + composefs)
            base: ghcr.io/projectbluefin/bluefin:lts
            target: ghcr.io/projectbluefin/dakota:stable
            filesystem: ext4
            # 20G default has intermittently ENOSPC'd (#42) — no XFS loopback
            # is involved here (ext4 natively supports fs-verity), so this is
            # just the outer disk being tight; match the LUKS scenario's 40G.
            disk_size: 40G
          - name: bluefin LTS -> dakota (LUKS + systemd-boot + composefs)
            base: ghcr.io/projectbluefin/bluefin:lts
            target: ghcr.io/projectbluefin/dakota:stable
            filesystem: xfs+crypt
            disk_size: 40G
          - name: bluefin LTS -> dakota (LVM-on-LUKS, separate /var + composefs)
            base: ghcr.io/projectbluefin/bluefin:lts
            target: ghcr.io/projectbluefin/dakota:stable
            filesystem: xfs+lvm+crypt
            # Was 40G — still ENOSPC'd during Phase-2 image pull twice (#42).
            # The BIOS-boot + ESP + separate /boot partitions and the fixed
            # 4G /var LV all come out of this before root sees any of it.
            disk_size: 60G
          - name: bluefin ostree re-base (OstreeDeploy)
            base: ghcr.io/projectbluefin/bluefin:stable
            # Genuinely distinct built image, same GNOME family — this is
            # the gating cell for Strategy::OstreeDeploy.
            #
            # History: gts was tried first but is an abandoned stream — it
            # crash-looped dbus-broker after `bootc switch` (2026-07-20), a
            # stale dbus setup on gts itself, not a bug in run_ostree_deploy.
            # lts was tried next but is currently content-identical to
            # stable (same ostree commit both boots, confirmed via kernel
            # cmdline checksum) — `bootc switch` correctly no-oped, but that
            # makes it a useless target for exercising a real switch. dakota
            # is confirmed distinct (used as a real target elsewhere in this
            # matrix) while staying same-DE, so it isolates the OstreeDeploy
            # mechanism from cross-DE identity-DB differences (see the
            # aurora cell below).
            target: ghcr.io/projectbluefin/dakota:stable
            mode: ostree-rebase
            # bootc switch pulls the full target into ostree storage inside
            # the guest — needs headroom beyond the tracer's 20G.
            disk_size: 40G
          - name: bluefin -> aurora ostree re-base (GNOME -> KDE, OstreeDeploy)
            base: ghcr.io/projectbluefin/bluefin:stable
            # Exploratory, non-gating: Aurora is ublue-os's KDE spin
            # (Bluefin is GNOME). A DE swap is a more aggressive exercise of
            # bootc switch's native /etc merge than a same-DE jump and may
            # surface cross-DE identity-DB differences (the messagebus-user
            # class of issue mergetc.rs handles for the composefs path) —
            # useful signal, but not a reason to block the OstreeDeploy
            # strategy itself.
            target: ghcr.io/ublue-os/aurora:stable
            mode: ostree-rebase
            disk_size: 40G
            allow_failure: true
          - name: bluefin LTS -> dakota cross-base re-base (CentOS -> Fedora)
            # M3 (#67) shipped the cross-base UID/GID remap planner and the
            # etc_conflict post-merge reconciliation pass, and #67 was closed
            # as completed — but the E2E cell named in its own scope was never
            # added, so neither had ever executed anywhere (#186, #187).
            #
            # Bluefin LTS is CentOS Stream 10-based (docs/filesystem-support.md)
            # and dakota is Fedora, so this pair genuinely differs on
            # ID/ID_LIKE and is_cross_base is true. The other bluefin:lts cells
            # do not exercise it: they run composefs-migrate, i.e. the MVP
            # binary, which merges via mergetc and has no is_cross_base gate.
            #
            # E2E_CROSS_BASE=1 adds --accept-cross-base (the route is refused
            # without it) AND asserts the remap report was printed — without
            # that assertion the cell would pass identically on a same-family
            # pair, which is how this gap stayed invisible.
            base: ghcr.io/projectbluefin/bluefin:lts
            target: ghcr.io/projectbluefin/dakota:stable
            mode: ostree-rebase
            cross_base: true
            # MUST be set explicitly, and must not be btrfs. The matrix
            # default is btrfs, which suits the Fedora-based bluefin:stable
            # cells; LTS is CentOS Stream 10 and ships XFS
            # (docs/filesystem-support.md), and its initramfs cannot find a
            # btrfs root — the first run of this cell inherited the default
            # and died in GRUB with "no such device: <root-uuid>" before the
            # guest ever booted, so the cross-base code never ran.
            #
            # ext4 matches the sibling LTS composefs cell (which passes) and
            # keeps the XFS ext4-loopback store out of a cell whose subject is
            # cross-base identity handling, not storage.
            filesystem: ext4
            disk_size: 40G
            # Exploratory on its first outing, following the aurora cell's
            # precedent: this is the first execution of two unproven
            # subsystems, and a first run that fails is information rather
            # than a regression. Graduate once it has a track record.
            allow_failure: true
          - name: bluefin -> dakota (TUI-driven migration)
            base: ghcr.io/projectbluefin/bluefin:stable
            target: ghcr.io/projectbluefin/dakota:stable
            # The composefs pipeline with a simulated human at the
            # controls: tests/tui-e2e-driver.py drives the interactive
            # Config Drift Review checklist (#15) and then the whole
            # migration through the TUI wizard on a pty inside the VM;
            # every downstream assertion of the default mode runs
            # unchanged. This is the only cell that exercises the
            # terminal event loops (ROADMAP M5 "no TUI assertions" gap).
            # Gating (no allow_failure) since run 33050814991 proved the
            # whole flow green on a hosted runner in 65 min: drift
            # checklist, wizard navigation, live migration, reboot into
            # composefs, rollback round-trip, commit.
            mode: tui-migrate
            disk_size: 40G
          # fedora-bootc self-migration is the simpler sanity case; revisit once
          # the bluefin scenario is green end-to-end.
          # - name: fedora-bootc self-migration
          #   base: quay.io/fedora/fedora-bootc:44
          #   target: quay.io/fedora/fedora-bootc:44
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Bluefin + Dakota are ~5 GB each. The default ubuntu-latest runner has
      # ~14 GB free; that plus a 20-60 GB disk.raw (a sparse file that grows
      # into real host disk as the guest writes to it), Rust target, and the
      # local registry can still blow the disk. Same action projectbluefin/
      # bluefin's own e2e uses (ublue-os/remove-unwanted-software).
      - name: Free disk space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9

      # GitHub-hosted runner images ship a podman storage config whose
      # overlay options leave "Native Overlay Diff: false", so every layer
      # commit falls back to the naive diff driver — a full walk-and-compare
      # of the ~10 GB bluefin rootfs, measured at ~30 min per trivial RUN on
      # the 2026-08-27 probes (the disk itself was fine at 419 MB/s, and the
      # driver was already overlay, not vfs). A minimal storage.conf plus a
      # reset of the still-empty graph cut the whole image bake to ~8 min.
      # Skipped on the self-hosted host, which owns its own storage config
      # and whose graph holds cached images worth keeping.
      - name: Use native overlay diffs for podman
        if: ${{ vars.E2E_SELF_HOSTED != 'true' }}
        run: |
          sudo tee /etc/containers/storage.conf >/dev/null <<'EOF'
          [storage]
          driver = "overlay"
          runroot = "/run/containers/storage"
          graphroot = "/var/lib/containers/storage"
          EOF
          sudo rm -rf /var/lib/containers/storage
          sudo podman info | grep -iA5 'graphStatus' || true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            ovmf \
            podman \
            jq \
            iproute2 \
            netcat-openbsd \
            cryptsetup \
            lvm2 \
            xfsprogs \
            dosfstools \
            swtpm \
            swtpm-tools \

      # Runs on a KVM-capable runner (self-hosted "kvm" label, or RunsOn
      # with nested-virt — see the job comment above).
      # Make /dev/kvm world-accessible so QEMU can use KVM acceleration (TCG
      # fallback is ~10x slower and blows the 45-minute job timeout — proven on
      # GitHub-hosted 2-core runners, where SSH banner exchanges time out).
      - name: Enable KVM access
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -la /dev/kvm
            kvm-ok 2>/dev/null || true
          else
            echo "::warning::/dev/kvm not present; falling back to TCG emulation will be slow"
          fi

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build migration binary
        run: cargo build --release && cargo test --release

      # Pull the base image into local podman storage so the e2e script can
      # layer sshd onto it. The migration streams the target directly from
      # the upstream registry (RegistryEndpoint does the ghcr.io bearer-token
      # dance) — no local registry mirroring, which burned ~35 min / 12 GB
      # and timed the job out before the e2e ever ran.
      - name: Pull base + target images
        run: |
          set -eux
          sudo podman pull "${{ matrix.scenario.base }}"
          sudo podman pull "${{ matrix.scenario.target }}"
          echo "BASE_IMAGE=${{ matrix.scenario.base }}" >> "$GITHUB_ENV"
          echo "TARGET_IMAGE=${{ matrix.scenario.target }}" >> "$GITHUB_ENV"
          echo "FILESYSTEM=${{ matrix.scenario.filesystem || 'btrfs' }}" >> "$GITHUB_ENV"
          echo "DISK_SIZE=${{ matrix.scenario.disk_size || '20G' }}" >> "$GITHUB_ENV"
          echo "E2E_MODE=${{ matrix.scenario.mode || 'composefs-migrate' }}" >> "$GITHUB_ENV"
          echo "E2E_CROSS_BASE=${{ matrix.scenario.cross_base && '1' || '0' }}" >> "$GITHUB_ENV"

      - name: Disk space before E2E
        run: df -h /

      - name: Run E2E test suite
        id: e2e
        run: |
          # Run as root: loop mounts, podman --privileged, and OVMF VARS pflash
          # all need it. -E so BASE_IMAGE/TARGET_IMAGE flow through.
          set -o pipefail
          sudo -E PATH="$PATH" ./tests/run-e2e.sh 2>&1 | tee e2e-run.log

      - name: Disk space after E2E
        if: always()
        run: df -h /

      # The tui-migrate cell records both interactive flows as asciicast
      # v2 and saves a per-screen text screenshot (see e2e-single.yml's
      # twin steps for details). Rendered GIF timelapse + raw casts +
      # screenshots are published on every run of that cell, pass or fail.
      - name: Render TUI timelapse GIFs
        if: ${{ always() && matrix.scenario.mode == 'tui-migrate' }}
        run: |
          if [ ! -f tui-migrate.cast ] && [ ! -f tui-drift.cast ]; then
            echo "no asciicast produced (run failed before the TUI flows)"; exit 0
          fi
          curl -sSL -o /tmp/agg \
            https://github.com/asciinema/agg/releases/download/v1.5.0/agg-x86_64-unknown-linux-gnu
          echo "59673469d625df6f55c72159c84ffbb7af1348ac379d0e79db43f4b80fb986a3  /tmp/agg" | sha256sum -c -
          chmod +x /tmp/agg
          if [ -f tui-migrate.cast ]; then
            /tmp/agg --idle-time-limit 2 --speed 3 tui-migrate.cast tui-migrate.gif || true
          fi
          if [ -f tui-drift.cast ]; then
            /tmp/agg --idle-time-limit 2 tui-drift.cast tui-drift.gif || true
          fi
          ls -la tui-*.gif 2>/dev/null || true

      - name: Upload TUI walkthrough artifacts
        if: ${{ always() && matrix.scenario.mode == 'tui-migrate' }}
        uses: actions/upload-artifact@v4
        with:
          name: tui-walkthrough-${{ strategy.job-index }}
          path: |
            tui-migrate.cast
            tui-drift.cast
            tui-migrate.gif
            tui-drift.gif
            tui-snapshots/
          if-no-files-found: warn
          retention-days: 14

      # Diagnosis starts from the job summary, not a 30 MB log download:
      # the last phase banner reached, every FAIL/ERROR assertion, and the
      # log tail land in $GITHUB_STEP_SUMMARY on failure.
      - name: Failure triage into job summary
        if: failure()
        run: |
          {
            echo "## E2E failure triage — ${{ matrix.scenario.name }}"
            if [ -f e2e-run.log ]; then
              echo '### Last phase reached'
              echo '```'
              grep -aE '^=== |\[e2e [0-9:]+\] ===' e2e-run.log | tail -5
              echo '```'
              echo '### Assertions and errors'
              echo '```'
              grep -aE 'FAIL:|ERROR:|Migration Failed|panicked' e2e-run.log | tail -20
              echo '```'
              echo '### Log tail'
              echo '```'
              tail -40 e2e-run.log
              echo '```'
            else
              echo 'e2e-run.log was never created — failure predates the harness.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ strategy.job-index }}
          path: |
            e2e-run.log
            qemu.log
            ovmf_vars.fd
          if-no-files-found: warn
          retention-days: 7
