name: E2E Migration Tests

permissions:
  contents: read

# Pull requests and pushes to main reach this workflow through ci.yml, which
# calls it (workflow_call) so `required-checks` can depend on the matrix
# directly instead of a runner sitting in a polling loop for hours. Those
# calls run a round-robin slice of the gating cells; the nightly schedule and
# manual dispatch run every cell. See .github/e2e-scenarios.yml.
on:
  workflow_call: {}
  workflow_dispatch: {}
  schedule:
    - cron: '23 3 * * *'

# Cancel superseded runs on the same ref so PR pushes don't queue up redundant
# jobs. The event name keeps a push to main from cancelling the nightly run.
concurrency:
  group: e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# The scenarios boot full VMs via QEMU and need hardware KVM acceleration.
# GitHub-hosted Linux runners DO expose /dev/kvm (proven 2026-08-27 by the
# e2e-single probes: crw-rw-rw- root:kvm, guest SSH in 31s), so the matrix
# now defaults to ubuntu-latest and gates every PR. Fork pull requests stay
# excluded: these jobs run privileged containers and QEMU on the runner.
#
# Runner selection, highest precedence first (docs/testing.md "KVM runner
# options"):
# - E2E_RUNSON_SPEC set → RunsOn on AWS (https://runs-on.com) ephemeral EC2.
#   Value is the label spec after the routing key, e.g.
#   family=c8i+m8i+r8i/cpu=8/ram=32/volume=120gb/nested-virt/image=ubuntu24-full-x64/spot=false
#   (nested-virt needs an x64 image on a supported family; spot=false or
#   retry=when-interrupted because these jobs run 30-90 min). The expression
#   below prepends the per-run routing key RunsOn requires.
# - E2E_SELF_HOSTED=true → the "kvm"-labelled self-hosted host (kanpur).
# - neither → ubuntu-latest (the default).
#
# KVM_E2E_ENABLED is a kill switch, not an enable switch: set it to 'false'
# to skip the whole matrix (required-checks treats a skipped job as a
# pass). Unset or 'true' both run.
#
# E2E_ROUND_ROBIN_SIZE (repo variable, default 2) is how many gating cells a
# pull request or push runs. The slice starts at (run_number * size) mod the
# number of gating cells, so consecutive runs walk the whole gating list.
jobs:
  plan:
    if: >-
      vars.KVM_E2E_ENABLED != 'false' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    outputs:
      scenarios: ${{ steps.pick.outputs.scenarios }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/e2e-scenarios.yml
          sparse-checkout-cone-mode: false
      - name: Pick scenarios
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          RUN_NUMBER: ${{ github.run_number }}
          SIZE: ${{ vars.E2E_ROUND_ROBIN_SIZE || '2' }}
        run: |
          set -euo pipefail
          all=$(yq -o=json -I=0 '.' .github/e2e-scenarios.yml)
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ]; then
            picked=$all
          else
            picked=$(jq -c --argjson run "$RUN_NUMBER" --argjson size "$SIZE" '
              [.[] | select(.allow_failure != true)] as $g
              | ($g | length) as $n
              | [range(0; [$size, $n] | min)
                 | $g[(($run * $size) + .) % $n]]' <<<"$all")
          fi
          echo "scenarios=$picked" >> "$GITHUB_OUTPUT"
          {
            echo "## E2E cells for this run ($EVENT, run $RUN_NUMBER)"
            jq -r '.[] | "- " + .name' <<<"$picked"
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    needs: plan
    name: ${{ matrix.scenario.name }}
    runs-on: >-
      ${{ vars.E2E_RUNSON_SPEC != '' &&
          format('runs-on={0}/{1}', github.run_id, vars.E2E_RUNSON_SPEC) ||
          (vars.E2E_SELF_HOSTED == 'true' &&
           fromJSON('["self-hosted", "kvm"]') || 'ubuntu-latest') }}
    # 90, not 45: the tui-migrate cell measured 65 min end to end on a
    # hosted runner (image bake + migration + reboot + rollback + commit,
    # all driven through the wizard).
    timeout-minutes: 90
    # Exploratory cells opt into continue-on-error via
    # matrix.scenario.allow_failure so they surface signal without failing
    # the run; only the scheduled and dispatched full matrix runs them.
    continue-on-error: ${{ matrix.scenario.allow_failure || false }}
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.plan.outputs.scenarios) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Bluefin + Dakota are ~5 GB each. The default ubuntu-latest runner has
      # ~14 GB free; that plus a 20-60 GB disk.raw (a sparse file that grows
      # into real host disk as the guest writes to it), Rust target, and the
      # local registry can still blow the disk. Same action projectbluefin/
      # bluefin's own e2e uses (ublue-os/remove-unwanted-software).
      - name: Free disk space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9

      # GitHub-hosted runner images ship a podman storage config whose
      # overlay options leave "Native Overlay Diff: false", so every layer
      # commit falls back to the naive diff driver — a full walk-and-compare
      # of the ~10 GB bluefin rootfs, measured at ~30 min per trivial RUN on
      # the 2026-08-27 probes (the disk itself was fine at 419 MB/s, and the
      # driver was already overlay, not vfs). A minimal storage.conf plus a
      # reset of the still-empty graph cut the whole image bake to ~8 min.
      # Skipped on the self-hosted host, which owns its own storage config
      # and whose graph holds cached images worth keeping.
      - name: Use native overlay diffs for podman
        if: ${{ vars.E2E_SELF_HOSTED != 'true' }}
        run: |
          sudo tee /etc/containers/storage.conf >/dev/null <<'EOF'
          [storage]
          driver = "overlay"
          runroot = "/run/containers/storage"
          graphroot = "/var/lib/containers/storage"
          EOF
          sudo rm -rf /var/lib/containers/storage
          sudo podman info | grep -iA5 'graphStatus' || true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            ovmf \
            podman \
            jq \
            iproute2 \
            netcat-openbsd \
            cryptsetup \
            lvm2 \
            xfsprogs \
            dosfstools \
            swtpm \
            swtpm-tools \

      # Runs on a KVM-capable runner (self-hosted "kvm" label, or RunsOn
      # with nested-virt — see the job comment above).
      # Make /dev/kvm world-accessible so QEMU can use KVM acceleration (TCG
      # fallback is ~10x slower and blows the 45-minute job timeout — proven on
      # GitHub-hosted 2-core runners, where SSH banner exchanges time out).
      - name: Enable KVM access
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -la /dev/kvm
            kvm-ok 2>/dev/null || true
          else
            echo "::warning::/dev/kvm not present; falling back to TCG emulation will be slow"
          fi

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build migration binary
        run: cargo build --release && cargo test --release

      # Pull the base image into local podman storage so the e2e script can
      # layer sshd onto it. The migration streams the target directly from
      # the upstream registry (RegistryEndpoint does the ghcr.io bearer-token
      # dance) — no local registry mirroring, which burned ~35 min / 12 GB
      # and timed the job out before the e2e ever ran.
      - name: Pull base + target images
        run: |
          set -eux
          sudo podman pull "${{ matrix.scenario.base }}"
          sudo podman pull "${{ matrix.scenario.target }}"
          {
            echo "BASE_IMAGE=${{ matrix.scenario.base }}"
            echo "TARGET_IMAGE=${{ matrix.scenario.target }}"
            echo "FILESYSTEM=${{ matrix.scenario.filesystem || 'btrfs' }}"
            echo "DISK_SIZE=${{ matrix.scenario.disk_size || '20G' }}"
            echo "E2E_MODE=${{ matrix.scenario.mode || 'composefs-migrate' }}"
            echo "E2E_DE_MIGRATE=${{ matrix.scenario.de_migrate && '1' || '0' }}"
            echo "E2E_BOOT_ENTRIES=${{ matrix.scenario.boot_entries && '1' || '0' }}"
            echo "E2E_CROSS_FAMILY=${{ matrix.scenario.cross_family && '1' || '0' }}"
            echo "E2E_EXPECT_OS_ID=${{ matrix.scenario.expect_os_id || '' }}"
            echo "E2E_EXPECT_DM=${{ matrix.scenario.expect_dm || '' }}"
            echo "E2E_ALLOWED_FAILED_UNITS=${{ matrix.scenario.allowed_failed_units || '' }}"
            echo "E2E_ALLOWED_MISLABELED=${{ matrix.scenario.allowed_mislabeled || '' }}"
            echo "E2E_DE_FROM=${{ matrix.scenario.de_from || 'gnome' }}"
            echo "E2E_CONSOLE_JOURNAL=${{ matrix.scenario.console_journal && '1' || '0' }}"
          } >> "$GITHUB_ENV"

      - name: Disk space before E2E
        run: df -h /

      - name: Run E2E test suite
        id: e2e
        run: |
          # Run as root: loop mounts, podman --privileged, and OVMF VARS pflash
          # all need it. -E so BASE_IMAGE/TARGET_IMAGE flow through.
          set -o pipefail
          sudo -E PATH="$PATH" ./tests/run-e2e.sh 2>&1 | tee e2e-run.log

      - name: Disk space after E2E
        if: always()
        run: df -h /

      # The tui-migrate cell records both interactive flows as asciicast
      # v2 and saves a per-screen text screenshot (see e2e-single.yml's
      # twin steps for details). Rendered GIF timelapse + raw casts +
      # screenshots are published on every run of that cell, pass or fail.
      - name: Render TUI timelapse GIFs
        if: ${{ always() && matrix.scenario.mode == 'tui-migrate' }}
        run: |
          if [ ! -f tui-migrate.cast ] && [ ! -f tui-drift.cast ]; then
            echo "no asciicast produced (run failed before the TUI flows)"; exit 0
          fi
          curl -sSL -o /tmp/agg \
            https://github.com/asciinema/agg/releases/download/v1.5.0/agg-x86_64-unknown-linux-gnu
          echo "59673469d625df6f55c72159c84ffbb7af1348ac379d0e79db43f4b80fb986a3  /tmp/agg" | sha256sum -c -
          chmod +x /tmp/agg
          if [ -f tui-migrate.cast ]; then
            /tmp/agg --idle-time-limit 2 --speed 3 tui-migrate.cast tui-migrate.gif || true
          fi
          if [ -f tui-drift.cast ]; then
            /tmp/agg --idle-time-limit 2 tui-drift.cast tui-drift.gif || true
          fi
          ls -la tui-*.gif 2>/dev/null || true

      - name: Upload TUI walkthrough artifacts
        if: ${{ always() && matrix.scenario.mode == 'tui-migrate' }}
        uses: actions/upload-artifact@v7
        with:
          name: tui-walkthrough-${{ strategy.job-index }}
          path: |
            tui-migrate.cast
            tui-drift.cast
            tui-migrate.gif
            tui-drift.gif
            tui-snapshots/
          if-no-files-found: warn
          retention-days: 14

      # Diagnosis starts from the job summary, not a 30 MB log download:
      # the last phase banner reached, every FAIL/ERROR assertion, and the
      # log tail land in $GITHUB_STEP_SUMMARY on failure.
      - name: Failure triage into job summary
        if: failure()
        run: |
          {
            echo "## E2E failure triage — ${{ matrix.scenario.name }}"
            if [ -f e2e-run.log ]; then
              echo '### Last phase reached'
              echo '```'
              # step() wraps the timestamp in ANSI colour, so the reset lands
              # between "]" and " ===" and an unescaped pattern never matches.
              sed 's/\x1b\[[0-9;]*[a-zA-Z]//g' e2e-run.log \
                | grep -aE '^=== |\[e2e [0-9:]+\] ===' | tail -5
              echo '```'
              echo '### Assertions and errors'
              echo '```'
              sed 's/\x1b\[[0-9;]*[a-zA-Z]//g' e2e-run.log \
                | grep -aE 'FAIL:|ERROR:|Migration Failed|panicked' | tail -20
              echo '```'
              echo '### Log tail'
              echo '```'
              tail -40 e2e-run.log
              echo '```'
            else
              echo 'e2e-run.log was never created — failure predates the harness.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs-${{ strategy.job-index }}
          path: |
            e2e-run.log
            qemu.log
            ovmf_vars.fd
          if-no-files-found: warn
          retention-days: 7
