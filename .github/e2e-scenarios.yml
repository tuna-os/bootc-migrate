# E2E migration scenarios for .github/workflows/e2e-tests.yml.
#
# Cells without `allow_failure: true` are gating. Pull requests and pushes to
# main run a round-robin slice of the gating cells (E2E_ROUND_ROBIN_SIZE,
# default 2, rotated by the CI run number), so every gating cell is exercised
# every few runs without each push booting the whole matrix. The nightly
# schedule and workflow_dispatch run every cell, exploratory ones included.
- name: bluefin -> dakota (systemd-boot + composefs)
  base: ghcr.io/projectbluefin/bluefin:stable
  target: ghcr.io/projectbluefin/dakota:stable
  # Display manager tests/e2e-health.sh requires after the reboot.
  expect_dm: gdm
  # 20G intermittently ENOSPCs during the Phase-2 podman pull
  # (#42-class; last seen 2026-07-19) — match the other cells.
  disk_size: 40G
- name: bluefin LTS -> dakota (systemd-boot + composefs)
  base: ghcr.io/projectbluefin/bluefin:lts
  target: ghcr.io/projectbluefin/dakota:stable
  # Display manager tests/e2e-health.sh requires after the reboot.
  expect_dm: gdm
  filesystem: ext4
  # 20G default has intermittently ENOSPC'd (#42) — no XFS loopback
  # is involved here (ext4 natively supports fs-verity), so this is
  # just the outer disk being tight; match the LUKS scenario's 40G.
  disk_size: 40G
- name: bluefin LTS -> dakota (LUKS + systemd-boot + composefs)
  base: ghcr.io/projectbluefin/bluefin:lts
  target: ghcr.io/projectbluefin/dakota:stable
  # Display manager tests/e2e-health.sh requires after the reboot.
  expect_dm: gdm
  filesystem: xfs+crypt
  # 40G stopped being enough when dakota:stable grew (10-08): the
  # phase-5 initrd rebuild hit ENOSPC under /var/tmp in 2 of 3 runs.
  # The image sits in the composefs loopback and in podman storage
  # (the overlay-mount fallback), both on this root.
  disk_size: 60G
- name: bluefin LTS -> dakota (LVM-on-LUKS, separate /var + composefs)
  base: ghcr.io/projectbluefin/bluefin:lts
  target: ghcr.io/projectbluefin/dakota:stable
  # Display manager tests/e2e-health.sh requires after the reboot.
  expect_dm: gdm
  filesystem: xfs+lvm+crypt
  # Was 40G — still ENOSPC'd during Phase-2 image pull twice (#42).
  # The BIOS-boot + ESP + separate /boot partitions and the fixed
  # 4G /var LV all come out of this before root sees any of it.
  disk_size: 60G
- name: bluefin ostree re-base (OstreeDeploy)
  base: ghcr.io/projectbluefin/bluefin:stable
  # Genuinely distinct built image, same GNOME family — this is
  # the gating cell for Strategy::OstreeDeploy.
  #
  # History: gts was tried first but is an abandoned stream — it
  # crash-looped dbus-broker after `bootc switch` (2026-07-20), a
  # stale dbus setup on gts itself, not a bug in run_ostree_deploy.
  # lts was tried next but is currently content-identical to
  # stable (same ostree commit both boots, confirmed via kernel
  # cmdline checksum) — `bootc switch` correctly no-oped, but that
  # makes it a useless target for exercising a real switch. dakota
  # is confirmed distinct (used as a real target elsewhere in this
  # matrix) while staying same-DE, so it isolates the OstreeDeploy
  # mechanism from cross-DE identity-DB differences (see the
  # aurora cell below).
  target: ghcr.io/projectbluefin/dakota:stable
  # Display manager tests/e2e-health.sh requires after the reboot.
  expect_dm: gdm
  mode: ostree-rebase
  # bootc switch pulls the full target into ostree storage inside
  # the guest — needs headroom beyond the tracer's 20G.
  disk_size: 40G
  # #189: the first cell to mutate real UEFI NVRAM. It runs #31's
  # efibootmgr executor and then restores from the snapshot, so the
  # write path and the undo path both get live coverage. Safe here
  # because the guest boots with a persistent OVMF VARS pflash and
  # is discarded afterwards.
  boot_entries: true
- name: bluefin -> aurora ostree re-base (GNOME -> KDE, OstreeDeploy)
  base: ghcr.io/projectbluefin/bluefin:stable
  # Exploratory, non-gating: Aurora is ublue-os's KDE spin
  # (Bluefin is GNOME). A DE swap is a more aggressive exercise of
  # bootc switch's native /etc merge than a same-DE jump and may
  # surface cross-DE identity-DB differences (the messagebus-user
  # class of issue mergetc.rs handles for the composefs path) —
  # useful signal, but not a reason to block the OstreeDeploy
  # strategy itself.
  target: ghcr.io/ublue-os/aurora:stable
  # Display manager tests/e2e-health.sh requires after the reboot.
  expect_dm: sddm
  mode: ostree-rebase
  disk_size: 40G
  # #188: this is the only genuinely cross-DE pair in the matrix, so
  # it is the only cell that can prove #68's stash/restore half. The
  # harness seeds a GNOME config, passes --de-migrate, and asserts
  # the stash directory exists afterwards.
  de_migrate: true
  allow_failure: true
- name: bluefin -> dakota (TUI-driven migration)
  base: ghcr.io/projectbluefin/bluefin:stable
  target: ghcr.io/projectbluefin/dakota:stable
  # Display manager tests/e2e-health.sh requires after the reboot.
  expect_dm: gdm
  # The composefs pipeline with a simulated human at the
  # controls: tests/tui-e2e-driver.py drives the interactive
  # Config Drift Review checklist (#15) and then the whole
  # migration through the TUI wizard on a pty inside the VM;
  # every downstream assertion of the default mode runs
  # unchanged. This is the only cell that exercises the
  # terminal event loops (ROADMAP M5 "no TUI assertions" gap).
  # Gating (no allow_failure) since run 33050814991 proved the
  # whole flow green on a hosted runner in 65 min: drift
  # checklist, wizard navigation, live migration, reboot into
  # composefs, rollback round-trip, commit.
  mode: tui-migrate
  disk_size: 40G
- name: bluefin -> openSUSE Tumbleweed (cross-family composefs migration)
  base: ghcr.io/projectbluefin/bluefin:stable
  # #256: the only pair in the matrix with NO shared ID_LIKE
  # lineage (fedora vs "opensuse suse"). Exploratory, non-gating:
  # first execution of the cross-family /etc policy on a real
  # target. The harness asserts the gate refuses without
  # --accept-cross-base, opts in, checks the staged /etc's shape
  # (target defaults, .rebase-old sidecars, carried machine
  # state) before the reboot, and the booted os-release ID plus
  # the first-boot unit's outcome after it. bootcrew's image is a
  # community composefs-native openSUSE bootc build; there is no
  # official one yet.
  target: ghcr.io/bootcrew/opensuse-bootc:latest
  disk_size: 40G
  cross_family: true
  expect_os_id: opensuse-tumbleweed
  allow_failure: true
- name: dakota -> fedora-bootc (composefs -> ostree, OstreeInstall)
  # #260: the reverse backend switch on a host that never had an
  # OSTree deployment. The base is installed composefs-native
  # (to-disk --composefs-backend); bootc-rebase then runs the
  # target's own `bootc install to-existing-root` alongside,
  # carries /etc and /var, restores the composefs ESP artifacts
  # and puts GRUB first. Exploratory, non-gating: first execution
  # of the route on a real host.
  #
  # The target must ship bootupd: bootc's ostree backend installs
  # its bootloader through it and refuses otherwise, and Dakota
  # (GNOME OS-based) ships none. bluefin:stable does, but it is
  # 9 GB in 270 layers and pulling plus importing it inside the
  # VM ran past the 90-minute job limit. fedora-bootc ships
  # bootupd, sshd and GRUB in a fraction of the size.
  base: ghcr.io/projectbluefin/dakota:stable
  target: quay.io/fedora/fedora-bootc:44
  mode: composefs-to-ostree
  disk_size: 40G
  allow_failure: true
# composefs -> composefs image swap across distributions: Dakota
# (GNOME OS-based, systemd-boot) to Utah (Bluefin on Fedora
# Hummingbird, composefs-enabled, GRUB via bootupd). Installs the
# base composefs-native, runs the ImageSwap route (the host's own
# `bootc switch`), and asserts the reboot lands in Utah with /etc,
# /var and /var/home carried and the Dakota deployment kept as
# rollback. utah publishes only :testing (pre-alpha), so this
# cell is non-gating.
# tunaOS desktop ring (Albacore, AlmaLinux 10): every
# desktop is both a source and a target once, and every
# display-manager hand-off runs (gdm -> greetd/DMS -> cosmic-greeter
# -> greetd/gtkgreet -> gdm). OstreeDeploy with --de-migrate: the
# outgoing desktop's config is seeded, stashed and restored, and
# tests/e2e-health.sh requires the target's display manager after
# the reboot. The images are about 2 GB, a fifth of Bluefin.
# Not Yellowfin: its rolling Kitten 10 base cannot start D-Bus
# after a fresh install (dbus_contexts is denied, tunaOS#2485),
# so every Yellowfin base fails before the migration starts.
# Non-gating until each pair has passed once.
- name: "tunaOS albacore gnome -> niri (OstreeDeploy, --de-migrate)"
  base: ghcr.io/tuna-os/albacore:gnome
  target: ghcr.io/tuna-os/albacore:niri
  mode: ostree-rebase
  disk_size: 40G
  de_migrate: true
  de_from: gnome
  expect_dm: greetd
  # tunaOS's own boot check: it waits up to 4 min for the system
  # to settle while it is itself still starting, and timed out
  # here with every migration check passing. It judges the image,
  # not the migration.
  allowed_failed_units: tunaos-base-contract.service
  # albacore:gnome's own policy is inconsistent: its
  # file_contexts.subs_dist maps /var/home to /home, but its
  # file_contexts.homedirs is written for /var/home, so it labels
  # every home default_t (niri, cosmic and xfce map /home to
  # /var/home and label homes user_home_t). /var/home labels then
  # differ across this pair whichever way the migration goes.
  # /etc stays fully checked.
  allowed_mislabeled: "/var/home/*"
  allow_failure: true
- name: "tunaOS albacore niri -> cosmic (OstreeDeploy, --de-migrate)"
  base: ghcr.io/tuna-os/albacore:niri
  target: ghcr.io/tuna-os/albacore:cosmic
  mode: ostree-rebase
  disk_size: 40G
  de_migrate: true
  de_from: niri
  expect_dm: cosmic-greeter
  # tunaOS's own boot check: it waits up to 4 min for the system
  # to settle while it is itself still starting, and timed out
  # here with every migration check passing. It judges the image,
  # not the migration.
  allowed_failed_units: tunaos-base-contract.service
  allow_failure: true
- name: "tunaOS albacore cosmic -> xfce (OstreeDeploy, --de-migrate)"
  base: ghcr.io/tuna-os/albacore:cosmic
  target: ghcr.io/tuna-os/albacore:xfce
  mode: ostree-rebase
  disk_size: 40G
  de_migrate: true
  de_from: cosmic
  expect_dm: greetd
  # tunaOS's own boot check: it waits up to 4 min for the system
  # to settle while it is itself still starting, and timed out
  # here with every migration check passing. It judges the image,
  # not the migration.
  allowed_failed_units: tunaos-base-contract.service
  allow_failure: true
- name: "tunaOS albacore xfce -> gnome (OstreeDeploy, --de-migrate)"
  base: ghcr.io/tuna-os/albacore:xfce
  target: ghcr.io/tuna-os/albacore:gnome
  mode: ostree-rebase
  disk_size: 40G
  de_migrate: true
  de_from: xfce
  expect_dm: gdm
  # tunaOS's own boot check: it waits up to 4 min for the system
  # to settle while it is itself still starting, and timed out
  # here with every migration check passing. It judges the image,
  # not the migration.
  allowed_failed_units: tunaos-base-contract.service
  # albacore:gnome's own policy is inconsistent: its
  # file_contexts.subs_dist maps /var/home to /home, but its
  # file_contexts.homedirs is written for /var/home, so it labels
  # every home default_t (niri, cosmic and xfce map /home to
  # /var/home and label homes user_home_t). /var/home labels then
  # differ across this pair whichever way the migration goes.
  # /etc stays fully checked.
  allowed_mislabeled: "/var/home/*"
  # Forward the journal to the serial console on one ring cell, so
  # an EL10 base that cannot start D-Bus (and so never reaches
  # SSH) leaves the reason in qemu.log. This is how tunaOS#2485
  # showed up on Yellowfin.
  console_journal: true
  allow_failure: true
- name: "dakota -> utah (composefs -> composefs, ImageSwap)"
  base: ghcr.io/projectbluefin/dakota:stable
  target: ghcr.io/projectbluefin/utah:testing
  # Display manager tests/e2e-health.sh requires after the reboot.
  expect_dm: gdm
  mode: image-swap
  disk_size: 40G
  # utah:testing is built on Fedora Hummingbird; since the
  # 2026-10-01 image its os-release says ID=hummingbird (run
  # 36964331436). The booted-image check above already proves the
  # target booted; this proves the target /etc/os-release won.
  expect_os_id: hummingbird
  allow_failure: true
