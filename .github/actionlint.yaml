self-hosted-runner:
  # Labels of self-hosted runners the E2E workflows can target. The "kvm" label
  # is the KVM-capable host (kanpur); it is opt-in via vars.E2E_SELF_HOSTED now
  # that the matrix defaults to GitHub-hosted runners.
  labels:
    - kvm
    # GitHub-hosted ubuntu-26.04 images (GA 2026-09-17) are unknown to the
    # pinned actionlint v1.7.12. Support is in rhysd/actionlint@bfc8e29
    # (unreleased); drop these once the pinned image includes it.
    - ubuntu-26.04
    - ubuntu-26.04-arm
paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      # actionlint does not yet parse GitHub's same-repo `$/` uses: form.
      - 'reusable workflow call "\$/.+" at "uses" is not following the format'
      - 'specifying action "\$/.+" in invalid format because ref is missing'
